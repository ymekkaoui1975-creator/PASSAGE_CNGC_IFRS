/* =====================================================================
   DESIGN SYSTEM · écrit une seule fois, réutilisé partout
   Noir « liquid UI » · palette : fond #000000 · cartes #050505 ·
   texte #E0AE28 · principale #FFFFFF · accent #E0AE28
   ===================================================================== */
:root{
  /* Couleurs */
  --c-fond:#000000;
  --c-carte:#050505;
  --c-texte:#E0AE28;
  --c-texte-doux:#C39A2E;
  --c-principale:#FFFFFF;
  --c-principale-doux:rgba(255,255,255,.78);
  --c-accent:#E0AE28;
  --c-entree:#E0AE28;          /* flowcharts : entrées en or */
  --c-sortie:#A3263B;          /* flowcharts : sorties en grenat lumineux */
  --c-total:#FFFFFF;           /* flowcharts : totaux en blanc */
  --c-vert:#5FD39A;            /* signaux sobres, toujours avec icône et mot */
  --c-orange:#F2A93B;
  --c-rouge:#FF6B7A;
  --c-bleu:#7DB9FF;
  --c-gris:#A8A8A8;
  --verre:rgba(5,5,5,.66);
  --verre-fort:rgba(5,5,5,.86);
  --bord:rgba(255,255,255,.10);
  --bord-fort:rgba(255,255,255,.18);
  --reflet:rgba(255,255,255,.06);
  /* Polices */
  --f-titre:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-texte:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  /* Échelle typographique fixe */
  --t-titre:40px;
  --t-sous-titre:24px;
  --t-chiffre:clamp(56px, 7vw, 104px);
  --t-texte:16px;
  --t-legende:13px;
  /* Espacements · échelle de 8 px */
  --e-1:8px; --e-2:16px; --e-3:24px; --e-4:32px; --e-5:40px; --e-6:48px; --e-8:64px; --e-10:80px;
  /* Rayons */
  --r-1:8px; --r-2:16px; --r-3:24px; --r-rond:999px;
  /* Ombres */
  --o-1:0 8px 24px rgba(0,0,0,.55);
  --o-2:0 24px 64px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.07);
  --o-lueur:0 0 0 1px rgba(224,174,40,.55), 0 0 32px rgba(224,174,40,.35);
  /* Mise en page */
  --rail:72px;
  --menu:312px;
  --bande:56px;
  --onglets:72px;
  --duree:200ms;
  --courbe:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{box-sizing:border-box}
html.anti-cadre body{visibility:hidden}
html{background:var(--c-fond);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;background:var(--c-fond);color:var(--c-texte);
  font-family:var(--f-texte);font-weight:300;font-size:var(--t-texte);line-height:1.55;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;color:var(--c-principale);margin:0;letter-spacing:.02em}
h1{font-size:var(--t-titre);line-height:1.15}
h2{font-size:var(--t-sous-titre);line-height:1.25}
h3{font-size:18px;line-height:1.3}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--c-principale);outline-offset:3px;border-radius:var(--r-1)}
.lecteur-seul{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.chiffre{font-family:var(--f-titre);font-weight:400;font-variant-numeric:tabular-nums lining-nums;color:var(--c-principale)}
.unite{font-family:var(--f-titre);color:var(--c-accent)}
.legende{font-size:var(--t-legende);color:var(--c-texte-doux)}

/* ---------- Fond animé : noir laqué, reflets lents ---------- */
#fond{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#000}
#fond .reflet{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(10px);opacity:1;will-change:transform}
#fond .r1{left:-30vmax;top:-35vmax;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.075), rgba(255,255,255,.02) 30%, rgba(0,0,0,0) 62%);animation:glisse1 26s ease-in-out infinite alternate}
#fond .r2{right:-35vmax;bottom:-40vmax;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.06), rgba(255,255,255,.015) 34%, rgba(0,0,0,0) 64%);animation:glisse2 30s ease-in-out infinite alternate}
#fond .r3{left:20vw;top:30vh;width:60vmax;height:60vmax;background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.035), rgba(0,0,0,0) 60%);animation:glisse3 22s ease-in-out infinite alternate}
#fond::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.035) 50%, rgba(255,255,255,0) 65%);background-size:300% 300%;animation:lustre 28s linear infinite}
#particules{position:fixed;inset:0;z-index:0;pointer-events:none;width:100vw;height:100vh}
@keyframes glisse1{from{transform:translate3d(0,0,0)}to{transform:translate3d(18vw,12vh,0)}}
@keyframes glisse2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-16vw,-10vh,0)}}
@keyframes glisse3{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-12vw,8vh,0) scale(1.15)}}
@keyframes lustre{from{background-position:0% 0%}to{background-position:300% 300%}}

/* ---------- Verre noir laqué ---------- */
.verre{
  position:relative;background:linear-gradient(180deg, var(--reflet), rgba(255,255,255,0) 42%), var(--verre);
  border:1px solid var(--bord);border-radius:var(--r-3);box-shadow:var(--o-2);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
}
.verre::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0));pointer-events:none}

/* ---------- Menu latéral (ordinateur) ---------- */
.menu{
  position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 30%), rgba(2,2,2,.78);
  border-right:1px solid var(--bord);overflow:hidden;
  -webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%);
  transition:width var(--duree) var(--courbe), box-shadow var(--duree) var(--courbe);
}
.menu:hover,.menu:focus-within{width:var(--menu);box-shadow:24px 0 64px rgba(0,0,0,.8)}
.menu .marque{display:flex;align-items:center;gap:var(--e-2);padding:var(--e-3) 16px var(--e-2);min-height:88px}
.monogramme{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-titre);font-size:20px;color:#000;background:linear-gradient(160deg,#F3CD5E,#E0AE28 45%,#9C7413);box-shadow:0 0 24px rgba(224,174,40,.25)}
.marque .txt b{display:block;font-family:var(--f-titre);font-weight:400;color:var(--c-principale);font-size:15px;letter-spacing:.06em}
.marque .txt span{font-size:12px;color:var(--c-texte-doux)}
.txt{white-space:nowrap;opacity:0;transition:opacity var(--duree) var(--courbe)}
.menu:hover .txt,.menu:focus-within .txt{opacity:1}
.nav{flex:0 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 12px var(--e-1);scrollbar-width:thin}
.nav ul{list-style:none;margin:0;padding:0}
.lien-nav{display:flex;align-items:center;gap:14px;min-height:44px;padding:8px 12px;border-radius:14px;text-decoration:none;color:var(--c-texte);cursor:pointer;border:1px solid transparent;transition:background var(--duree),border-color var(--duree)}
.lien-nav:hover{background:rgba(255,255,255,.05)}
.lien-nav[aria-current="page"]{background:rgba(255,255,255,.07);border-color:var(--bord);color:var(--c-principale)}
.lien-nav svg{flex:0 0 22px;width:22px;height:22px}
.lien-nav .txt{flex:1;overflow:hidden;text-overflow:ellipsis}
.famille-ligne{display:flex;align-items:center;gap:2px}
.famille-ligne .lien-nav{flex:1;min-width:0;padding-left:6px}
.bouton-deplier{flex:0 0 32px;height:32px;border:0;background:transparent;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--c-texte)}
.bouton-deplier:hover{background:rgba(255,255,255,.06)}
.bouton-deplier svg{width:16px;height:16px;transition:transform var(--duree) var(--courbe)}
.bouton-deplier[aria-expanded="true"] svg{transform:rotate(90deg)}
.nav-familles{margin:2px 0 6px 10px;padding-left:6px;border-left:1px solid var(--bord)}
.nav-kpis{margin:0 0 4px 38px}
.nav-kpis .lien-nav{min-height:36px;padding:6px 10px;font-size:14px}
.code-kpi{font-family:var(--f-titre);color:var(--c-accent);font-size:12px;margin-right:6px}
.menu:not(:hover):not(:focus-within) .nav-familles{display:none}
.menu:not(:hover):not(:focus-within) .pastille-menu{display:none}

/* ---------- Pastilles de statut (couleur + icône + mot) ---------- */
.pastille{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:var(--r-rond);font-size:12px;font-weight:400;letter-spacing:.02em;white-space:nowrap;border:1px solid currentColor;background:rgba(0,0,0,.35)}
.pastille svg{width:13px;height:13px;flex:0 0 13px}
.pastille.vert{color:var(--c-vert)}
.pastille.orange{color:var(--c-orange)}
.pastille.rouge{color:var(--c-rouge)}
.pastille.aucun{color:var(--c-gris)}
.pastille-menu{padding:1px 8px 1px 6px;font-size:11px}

/* ---------- Panneau de synchronisation ---------- */
.sync{margin:var(--e-1) 12px var(--e-2);padding:14px;border-radius:18px;border:1px solid var(--bord);background:rgba(255,255,255,.03)}
.sync-icone{display:none;width:44px;height:44px;margin:0 auto;border-radius:14px;place-items:center;position:relative;color:var(--c-texte)}
.sync-icone svg{width:22px;height:22px}
.sync-icone .point{position:absolute;right:8px;top:8px}
.menu:not(:hover):not(:focus-within) .sync{padding:6px 0;border-color:transparent;background:transparent;margin:var(--e-1) 0}
.menu:not(:hover):not(:focus-within) .sync-icone{display:grid}
.menu:not(:hover):not(:focus-within) .sync-detail{display:none}
.sync-haut{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sync-titre{font-size:13px;color:var(--c-principale);font-weight:400}
.etat{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--c-principale-doux);margin-bottom:10px;min-height:20px}
.point{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-top:5px;background:var(--c-gris)}
.point.vert{background:var(--c-vert);box-shadow:0 0 0 0 rgba(95,211,154,.6);animation:pulse 2.4s ease-in-out infinite}
.point.gris{background:var(--c-gris)}
.point.bleu{background:var(--c-bleu);animation:clignote 1s ease-in-out infinite}
.point.orange{background:var(--c-orange)}
.point.rouge{background:var(--c-rouge)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,154,.55)}70%{box-shadow:0 0 0 8px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}
@keyframes clignote{50%{opacity:.35}}
.sync-infos{font-size:12px;color:var(--c-texte-doux);display:grid;gap:2px;margin-bottom:12px;word-break:break-word}
.sync-infos b{font-weight:400;color:var(--c-principale-doux)}
.sync-boutons{display:grid;gap:8px}
.sync-message{font-size:12px;color:var(--c-principale-doux);margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--bord)}
.lien-discret{background:none;border:0;padding:4px 0;font-size:12px;color:var(--c-texte-doux);text-decoration:underline;text-underline-offset:3px;cursor:pointer;justify-self:start}

/* Interrupteur « Synchronisation » */
.interrupteur{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:2px;cursor:pointer;border-radius:var(--r-rond)}
.interrupteur .piste{position:relative;width:44px;height:24px;border-radius:12px;background:#3A3A3A;border:1px solid rgba(255,255,255,.14);transition:background var(--duree) var(--courbe);flex:0 0 44px}
.interrupteur .rond{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#C9C9C9;box-shadow:0 2px 6px rgba(0,0,0,.6);transition:transform var(--duree) var(--courbe), background var(--duree)}
.interrupteur[aria-checked="true"] .piste{background:var(--c-principale)}
.interrupteur[aria-checked="true"] .rond{transform:translateX(20px);background:#000}

/* ---------- Boutons premium ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:10px 20px;border-radius:var(--r-rond);font-size:15px;font-weight:400;letter-spacing:.01em;cursor:pointer;text-decoration:none;transition:transform var(--duree) var(--courbe), box-shadow var(--duree), background var(--duree), border-color var(--duree);white-space:nowrap}
.btn svg{width:18px;height:18px;flex:0 0 18px}
.btn-principal{color:#000;border:1px solid #F3CD5E;background:linear-gradient(160deg,#F6D46C,#E0AE28 48%,#B88A17);box-shadow:0 10px 30px rgba(224,174,40,.22), inset 0 1px 0 rgba(255,255,255,.55)}
.btn-principal:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(224,174,40,.34), inset 0 1px 0 rgba(255,255,255,.6)}
.btn-secondaire{color:var(--c-principale);border:1px solid var(--bord-fort);background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02))}
.btn-secondaire:hover{border-color:rgba(255,255,255,.32);background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03))}
.btn-petit{min-height:36px;padding:6px 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- Contenu principal ---------- */
#contenu{position:relative;z-index:1;margin-left:var(--rail);padding:var(--e-5) var(--e-6) var(--e-10);min-height:100vh}
.page{max-width:1360px;margin:0 auto}
.ariane{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:var(--t-legende);color:var(--c-texte-doux);margin-bottom:var(--e-3)}
.ariane a{text-decoration:none;color:var(--c-texte-doux)}
.ariane a:hover{color:var(--c-principale)}
.ariane [aria-current]{color:var(--c-principale)}
.ariane svg{width:12px;height:12px;opacity:.6}
.entete-page{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--e-2);margin-bottom:var(--e-4)}
.surtitre{font-size:var(--t-legende);letter-spacing:.18em;text-transform:uppercase;color:var(--c-texte);margin-bottom:var(--e-1)}
.section{margin-top:var(--e-6)}
.section > h2{margin-bottom:var(--e-1)}
.section > .legende{margin-bottom:var(--e-3)}
.alertes{display:grid;gap:var(--e-2);margin-bottom:var(--e-3)}
.alerte{display:flex;gap:var(--e-2);align-items:flex-start;padding:var(--e-2) var(--e-3);border-radius:var(--r-2);border:1px solid rgba(255,107,122,.45);background:rgba(40,4,10,.55);color:var(--c-principale)}
.alerte.attention{border-color:rgba(242,169,59,.45);background:rgba(40,26,4,.5)}
.alerte svg{width:22px;height:22px;flex:0 0 22px;color:var(--c-rouge);margin-top:2px}
.alerte.attention svg{color:var(--c-orange)}
.alerte ul{margin:6px 0 0;padding-left:18px;color:var(--c-principale-doux);font-size:14px}
.alerte .actions{margin-top:var(--e-1)}

/* Héros : la réponse principale en 3 secondes */
.heros{padding:var(--e-5);margin-bottom:var(--e-4);overflow:hidden}
.heros .verdict{font-family:var(--f-titre);color:var(--c-principale);font-size:clamp(26px,3.2vw,40px);line-height:1.2;max-width:28ch}
.heros .message{margin-top:var(--e-2);font-size:18px;color:var(--c-principale-doux);max-width:78ch}
.heros .controle{margin-top:var(--e-3);display:flex;flex-wrap:wrap;gap:var(--e-1) var(--e-2);align-items:center}
.flux{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--e-2);margin-top:var(--e-4)}
.flux .bloc{padding:var(--e-2) var(--e-2) 14px;border-radius:var(--r-2);border:1px solid var(--bord);background:rgba(255,255,255,.025)}
.flux .bloc .lib{font-size:12px;color:var(--c-texte);letter-spacing:.04em;min-height:36px}
.flux .bloc .val{font-size:clamp(22px,2.2vw,32px);line-height:1.1;margin-top:6px;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.flux .bloc .val .unite{font-size:13px}
.flux .bloc .avant{font-size:12px;color:var(--c-texte-doux);margin-top:6px}
.flux .bloc.total{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.05)}

/* Cartes KPI très grand format */
.grille-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e-3)}
.carte-kpi{padding:var(--e-4);display:flex;flex-direction:column;gap:var(--e-2);cursor:pointer;transition:transform var(--duree) var(--courbe), box-shadow var(--duree) var(--courbe), border-color var(--duree);min-width:0}
.carte-kpi:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.2);box-shadow:0 32px 80px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.1)}
.carte-kpi.illumine{box-shadow:var(--o-lueur), var(--o-2);border-color:rgba(224,174,40,.7);transition:box-shadow 400ms, border-color 400ms}
.carte-haut{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--e-2)}
.carte-titre{display:flex;flex-direction:column;gap:4px;min-width:0}
.carte-titre a{font-size:15px;color:var(--c-texte);text-decoration:none;letter-spacing:.03em;font-weight:400}
.carte-titre a:hover{color:var(--c-principale)}
.carte-titre .code{font-family:var(--f-titre);font-size:12px;color:var(--c-texte-doux);letter-spacing:.1em}
.valeur-geante{font-size:var(--t-chiffre);line-height:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .22em;word-break:keep-all}
.valeur-geante .unite{font-size:.3em;letter-spacing:.04em}
.carte-bas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--e-2)}
.comparaison{display:flex;flex-wrap:wrap;gap:var(--e-1) var(--e-3);font-size:15px;color:var(--c-principale-doux)}
.comparaison .chiffre{font-size:18px}
.comparaison .variation{color:var(--c-accent);font-family:var(--f-titre);font-size:18px}
.sparkline{display:block;width:100%;max-width:240px;height:40px;overflow:visible}

/* Infobulle (formule) */
.infobulle{position:relative;display:inline-flex}
.bouton-info{width:32px;height:32px;border-radius:50%;border:1px solid var(--bord);background:rgba(255,255,255,.03);display:grid;place-items:center;cursor:help;color:var(--c-texte)}
.bouton-info svg{width:16px;height:16px}

    }
    if (taille > LIMITES.tailleMax) {

    if (!octets) return ext;

    } else if (ext === '.xls') {

      if (!ole) throw new ErreurSecurite('Ce fichier porte l’extension .xls mais ce n’est pas un vrai classeur Excel.');
    } else if (ext === '.csv') {

  /* Normalisation : majuscules, sans accents, espaces réduits. */

  /* Lecture tolérante des nombres : « 1 234,56 », « 1,234.56 », « (1 234) », « 12 % ». */
  function lireNombreTexte(brut) {
    let s = String(brut).trim();
    if (!s) return null;
    let negatif = false;
    if (/^\(.*\)$/.test(s)) { negatif = true; s = s.slice(1, -1); }
    s = s.replace(/[   \s]/g, '').replace(/−/g, '-');
    let pourcent = false;
    if (s.endsWith('%')) { pourcent = true; s = s.slice(0, -1); }
    s = s.replace(/(MAD|DH|DHS|KMAD|J|JOURS|×|X)$/i, '');
    if (s.startsWith('-')) { negatif = !negatif; s = s.slice(1); }
    else if (s.startsWith('+')) s = s.slice(1);
    const virgule = s.lastIndexOf(','), point = s.lastIndexOf('.');
    if (virgule >= 0 && point >= 0) {
      if (virgule > point) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (virgule >= 0) {
      s = (s.split(',').length > 2) ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (point >= 0 && s.split('.').length > 2) {

    let n = Number(s);
    if (!Number.isFinite(n)) return null;

    return negatif ? -n : n;

    if (v === null) {
      if (ctx.formulesSansValeur > avant) {
        ctx.ajouterProbleme(def.onglet, def.nom, 'La formule du nom « ' + def.nom + ' » (onglet ' + def.onglet + ') n’a pas de valeur calculée. Ouvrez le fichier dans Excel et enregistrez-le pour calculer les formules.');
      } else if (def.type === 'nombre' || def.type === 'texte') {
        ctx.ajouterProbleme(def.onglet, def.nom, 'Le nom défini « ' + def.nom + ' » (onglet ' + def.onglet + ', ' + adresse(pos.r, pos.c) + ') est vide ou n’est pas ' + (def.type === 'nombre' ? 'un nombre' : 'un texte') + '.');
      }
    }
    return v;
  }

  /* Cherche une ligne d'en-têtes : renvoie la ligne et la carte des colonnes. */
  function carteEntetes(ctx, ws, r, synonymes, cDebut, cFin) {
    const carte = objetSansPrototype();
    const plage = plageFeuille(ws);
    const debut = cDebut === undefined ? plage.s.c : cDebut;
    const fin = cFin === undefined ? plage.e.c : cFin;
    for (let c = debut; c <= fin; c++) {
      const t = normaliser(texteCellule(ctx, cellule(ws, r, c)));
      if (!t || COLONNES_INTERDITES.has(t)) continue; /* __proto__, constructor, prototype : ignorés */
      for (const cle of Object.keys(synonymes)) {
        if (carte[cle] !== undefined) continue;
        if (synonymes[cle].some(function (s) { return normaliser(s) === t; })) { carte[cle] = c; break; }
      }
    }
    return carte;
  }
  function chercherLigneEntetes(ctx, ws, synonymes, obligatoires, rDebut, rFin) {
    const plage = plageFeuille(ws);
    const debut = rDebut === undefined ? plage.s.r : rDebut;
    const fin = Math.min(rFin === undefined ? plage.e.r : rFin, plage.e.r);
    for (let r = debut; r <= fin; r++) {
      const carte = carteEntetes(ctx, ws, r, synonymes);
      if (obligatoires.every(function (k) { return carte[k] !== undefined; })) return { r: r, colonnes: carte };
    }
    return null;
  }
  /* Cherche une cellule dont le texte commence par un titre donné. */
  function chercherTitre(ctx, ws, titre, rDebut) {
    const plage = plageFeuille(ws);
    const cible = normaliser(titre);
    for (let r = rDebut || plage.s.r; r <= plage.e.r; r++) {
      for (let c = plage.s.c; c <= Math.min(plage.e.c, plage.s.c + 15); c++) {
        const t = normaliser(texteCellule(ctx, cellule(ws, r, c)));
        if (t && t.startsWith(cible)) return { r: r, c: c };
      }
    }
    return null;
  }
  /* Colonne des codes : en-tête reconnu, sinon colonne B, sinon recherche. */
  function colonneDesCodes(ctx, ws, rEntete, carte, motif) {
    if (carte.code !== undefined) return carte.code;
    const plage = plageFeuille(ws);
    for (let c = plage.s.c; c <= Math.min(plage.e.c, 9); c++) {
      for (let r = rEntete + 1; r <= Math.min(plage.e.r, rEntete + 6); r++) {
        if (motif.test(normaliser(texteCellule(ctx, cellule(ws, r, c))))) return c;
      }
    }
    return 1;
  }

  function premierTexte(ctx, ws) {
    if (!ws) return '';
    const plage = plageFeuille(ws);
    for (let r = plage.s.r; r <= Math.min(plage.e.r, plage.s.r + 9); r++) {
      for (let c = plage.s.c; c <= Math.min(plage.e.c, plage.s.c + 9); c++) {
        const v = valeurCellule(ctx, cellule(ws, r, c));
        if (typeof v === 'string' && v.trim().length > 3) return v.trim();
      }
    }
    return '';
  }

  /* --- TFT : lignes O1 à T1, méthode indirecte --- */
  function lireTFT(ctx) {
    const onglet = trouverOnglet(ctx, 'tft');
    if (!onglet) return null;
    const ws = onglet.ws;
    const f = FORMAT_ATTENDU.codesTFT;
    const ent = chercherLigneEntetes(ctx, ws, f.entetes, ['courant', 'precedent'], undefined, undefined);
    if (!ent) {
      ctx.ajouterProbleme('TFT', 'en-têtes', 'Ligne d’en-têtes introuvable dans l’onglet TFT : il faut les colonnes « 2027 » et « 2026 ».');
      return null;
    }
    const col = ent.colonnes;
    const cCode = colonneDesCodes(ctx, ws, ent.r, col, /^(O|I|F|D)\d+$|^(OT|IT|FT|OS|V|T0|T1)$/);
    const cLib = col.libelle !== undefined ? col.libelle : cCode + 1;
    const plage = plageFeuille(ws);
    const lignes = [];
    const parCode = objetSansPrototype();
    let commence = false, fini = false, vides = 0;
    for (let r = ent.r + 1; r <= plage.e.r && !fini; r++) {
      const code = normaliser(texteCellule(ctx, cellule(ws, r, cCode)));
      const libelle = texteCellule(ctx, cellule(ws, r, cLib));
      if (!code && !libelle) { vides++; if (commence && vides > 3) break; continue; }
      vides = 0;
      if (code && COLONNES_INTERDITES.has(code)) continue;
      if (code === f.premier) commence = true;
      if (!commence) {
        if (!code && libelle) lignes.push({ type: 'titre', code: '', libelle: libelle });
        continue;
      }
      if (!code) {
        if (normaliser(libelle).startsWith('TOTAL')) continue; /* ligne « Total » ajoutée : ignorée */
        lignes.push({ type: 'titre', code: '', libelle: libelle });
        continue;
      }
      if (parCode[code]) continue;
      const v27 = nombreCellule(ctx, cellule(ws, r, col.courant));
      const v26 = nombreCellule(ctx, cellule(ws, r, col.precedent));
      const note = col.note !== undefined ? texteCellule(ctx, cellule(ws, r, col.note)) : '';
      const type = f.totaux.includes(code) ? 'total' : (f.sousTotaux.includes(code) ? 'sous-total' : 'ligne');
      const ligne = { type: type, code: code, libelle: libelle, v27: v27, v26: v26, note: note };
      lignes.push(ligne);
      parCode[code] = ligne;
      if (code === f.dernier) fini = true;
    }
    /* On ne garde que les titres placés avant une ligne chiffrée. */
    const premierIndex = lignes.findIndex(function (l) { return l.code === f.premier; });
    const resultat = lignes.filter(function (l, i) { return l.type !== 'titre' || (i >= premierIndex - 1); });
    for (const code of f.requis) {
      if (!parCode[code]) ctx.ajouterProbleme('TFT', code, 'Code de ligne manquant : « ' + code + ' » dans l’onglet TFT (colonne B).');
      else if (parCode[code].v27 === null) ctx.ajouterProbleme('TFT', code, 'La ligne « ' + code + ' » de l’onglet TFT n’a pas de montant 2027.');
    }
    return { lignes: resultat, parCode: parCode, titre: premierTexte(ctx, ws) };
  }

  /* --- KPI : section 1 (valeurs et feux), section 2 (dictionnaire), seuils --- */
  function feuDepuisTexte(t) {
    const n = normaliser(t);
    if (n === 'VERT' || n === 'GREEN') return 'vert';
    if (n === 'AMBRE' || n === 'ORANGE' || n === 'AMBER') return 'orange';
    if (n === 'ROUGE' || n === 'RED') return 'rouge';
    return 'aucun';
  }
  function nomCourt(nom) { return String(nom || '').replace(/\s*\([^()]*\)\s*$/, '').trim(); }
  function formuleDepuisNom(nom) {
    const m = /\(([^()]*)\)\s*$/.exec(String(nom || ''));
    return m && /[÷+−×\-]/.test(m[1]) ? m[1].trim() : '';
  }

  function lireLignesCodes(ctx, ws, ent, motif) {
    const cCode = colonneDesCodes(ctx, ws, ent.r, ent.colonnes, motif);
    const plage = plageFeuille(ws);
    const lignes = [];
    let vides = 0, commence = false;
    for (let r = ent.r + 1; r <= plage.e.r; r++) {
      const code = normaliser(texteCellule(ctx, cellule(ws, r, cCode)));
      if (motif.test(code)) { lignes.push({ r: r, code: code }); commence = true; vides = 0; continue; }
      if (commence) { vides++; if (vides > 2) break; }
    }
    return lignes;
  }

  function lireKPI(ctx) {
    const onglet = trouverOnglet(ctx, 'kpi');
    if (!onglet) return null;
    const ws = onglet.ws;
    const fk = FORMAT_ATTENDU.codesKPI;
    const ent = chercherLigneEntetes(ctx, ws, fk.entetes, ['courant', 'precedent', 'feuCourant']);
    if (!ent) {
      ctx.ajouterProbleme('KPI', 'en-têtes', 'Tableau des KPI introuvable dans l’onglet KPI : il faut les colonnes « 2027 », « 2026 » et « Feu 2027 ».');
      return null;
    }
    const col = ent.colonnes;
    const cLib = col.libelle !== undefined ? col.libelle : 2;
    const liste = [];
    const parCode = objetSansPrototype();
    for (const l of lireLignesCodes(ctx, ws, ent, fk.motif)) {
      if (parCode[l.code]) continue;
      const nom = texteCellule(ctx, cellule(ws, l.r, cLib));
      const nomDef = col.nomDefini !== undefined ? texteCellule(ctx, cellule(ws, l.r, col.nomDefini)) : '';
      const k = {
        code: l.code,
        nom: nom,
        nomCourt: nomCourt(nom),
        formule: formuleDepuisNom(nom),
        v27: nombreOuTexteCellule(ctx, cellule(ws, l.r, col.courant)),
        v26: nombreOuTexteCellule(ctx, cellule(ws, l.r, col.precedent)),
        variation: col.variation !== undefined ? nombreOuTexteCellule(ctx, cellule(ws, l.r, col.variation)) : null,
        feu27: feuDepuisTexte(texteCellule(ctx, cellule(ws, l.r, col.feuCourant))),
        feu26: col.feuPrecedent !== undefined ? feuDepuisTexte(texteCellule(ctx, cellule(ws, l.r, col.feuPrecedent))) : 'aucun',
        unite: (nomDef.split('·')[1] || '').trim(),
        dico: null,
        seuil: null
      };
      liste.push(k);
      parCode[l.code] = k;
    }
    for (const code of fk.requis) {
      if (!parCode[code]) ctx.ajouterProbleme('KPI', code, 'Code de ligne manquant : « ' + code + ' » dans l’onglet KPI (colonne B).');
    }
    /* Dictionnaire */
    const fd = FORMAT_ATTENDU.dictionnaire;
    const entD = chercherLigneEntetes(ctx, ws, fd.entetes, ['definition']);
    if (!entD) {
      ctx.ajouterProbleme('KPI', 'dictionnaire', 'Dictionnaire des KPI introuvable dans l’onglet KPI : il faut la colonne « Définition ».');
    } else {
      const cd = entD.colonnes;
      for (const l of lireLignesCodes(ctx, ws, entD, fk.motif)) {
        const k = parCode[l.code];
        if (!k || k.dico) continue;
        const lire = function (cle) { return cd[cle] !== undefined ? texteCellule(ctx, cellule(ws, l.r, cd[cle])) : ''; };
        k.dico = { definition: lire('definition'), unite: lire('unite'), vert: lire('vert'), ambre: lire('ambre'), rouge: lire('rouge'), pourquoi: lire('pourquoi') };
        if (k.dico.unite) k.unite = k.dico.unite;
      }
    }
    /* Seuils des feux */
    const fs = FORMAT_ATTENDU.seuils;
    const entS = chercherLigneEntetes(ctx, ws, fs.entetes, ['sens', 'vert']);
    if (entS) {
      const cs = entS.colonnes;
      for (const l of lireLignesCodes(ctx, ws, entS, fk.motif)) {
        const k = parCode[l.code];
        if (!k || k.seuil) continue;
        k.seuil = {
          sens: normaliser(texteCellule(ctx, cellule(ws, l.r, cs.sens))).toLowerCase(),
          vert: nombreCellule(ctx, cellule(ws, l.r, cs.vert)),
          ambre: cs.ambre !== undefined ? nombreCellule(ctx, cellule(ws, l.r, cs.ambre)) : null
        };
      }
    }
    return { liste: liste, parCode: parCode, titre: premierTexte(ctx, ws), ws: ws };
  }

  /* --- KPI section 4 : données des graphiques --- */
  function lireBlocGraphique(ctx, ws, def, cleTitre, colonnesRequises) {
    const pos = chercherTitre(ctx, ws, def.titre);
    if (!pos) { ctx.ajouterProbleme('KPI', cleTitre, 'Données du graphique « ' + cleTitre + ' » introuvables dans l’onglet KPI (section 4).'); return []; }
    const carte = carteEntetes(ctx, ws, pos.r, def.entetes);
    for (const k of colonnesRequises) {
      if (carte[k] === undefined) { ctx.ajouterProbleme('KPI', cleTitre, 'Colonne manquante pour le graphique « ' + cleTitre + ' » (onglet KPI, section 4).'); return []; }
    }
    const lignes = [];
    const plage = plageFeuille(ws);
    for (let r = pos.r + 1; r <= plage.e.r; r++) {
      const lib = texteCellule(ctx, cellule(ws, r, pos.c));
      if (!lib) break;
      if (COLONNES_INTERDITES.has(normaliser(lib))) continue;
      const ligne = { libelle: lib.split(' · ')[0].trim(), libelleComplet: lib };
      for (const k of Object.keys(def.entetes)) {
        if (carte[k] === undefined) continue;
        ligne[k] = (k === 'sens' || k === 'repere') ? texteCellule(ctx, cellule(ws, r, carte[k])) : nombreCellule(ctx, cellule(ws, r, carte[k]));
      }
      lignes.push(ligne);
    }
    if (!lignes.length) ctx.ajouterProbleme('KPI', cleTitre, 'Le graphique « ' + cleTitre + ' » n’a aucune ligne de données (onglet KPI, section 4).');
    return lignes;
  }
  function lireGraphiques(ctx, ws) {
    const g = FORMAT_ATTENDU.graphiques;
    return {
      radar: lireBlocGraphique(ctx, ws, g.radar, 'Radar', ['s27', 's26']),
      entonnoir: lireBlocGraphique(ctx, ws, g.entonnoir, 'Entonnoir', ['valeur']),
      cascade: lireBlocGraphique(ctx, ws, g.cascade, 'Cascade', ['debut', 'fin']),
      jauges: lireBlocGraphique(ctx, ws, g.jauge, 'Jauge', ['valeur'])
    };
  }

  /* --- KPI section 5 : décision du DG et recommandations --- */
  function lireDecision(ctx, ws) {
    const d = FORMAT_ATTENDU.decision;
    const resultat = { bfr: [], recommandations: [], avertissement: '' };
    const pos = chercherTitre(ctx, ws, d.titre);
    if (!pos) { ctx.ajouterProbleme('KPI', 'section 5', 'Tableau « Poste du cycle de cash » introuvable dans l’onglet KPI (section 5).'); return resultat; }
    const carte = carteEntetes(ctx, ws, pos.r, d.entetes);
    const plage = plageFeuille(ws);
    let r = pos.r + 1;
    for (; r <= plage.e.r; r++) {
      const lib = texteCellule(ctx, cellule(ws, r, pos.c));
      if (!lib) break;
      resultat.bfr.push({
        poste: lib,
        valeur: carte.valeur !== undefined ? nombreCellule(ctx, cellule(ws, r, carte.valeur)) : null,
        seuilVert: carte.seuilVert !== undefined ? nombreCellule(ctx, cellule(ws, r, carte.seuilVert)) : null,
        ecart: carte.ecart !== undefined ? nombreCellule(ctx, cellule(ws, r, carte.ecart)) : null
      });
    }
    for (; r <= plage.e.r; r++) {
      for (let c = plage.s.c; c <= Math.min(plage.e.c, plage.s.c + 12); c++) {
        const t = texteCellule(ctx, cellule(ws, r, c));
        if (!t) continue;
        if (/^\d+\s*[.)]\s+\S/.test(t) && t.length > 20 && resultat.recommandations.length < d.nombreRecommandations) resultat.recommandations.push(t);
        else if (resultat.recommandations.length && !resultat.avertissement && t.length > 20) resultat.avertissement = t;
      }
    }
    return resultat;
  }

  function lireMessagePrincipal(ctx) {
    const o = trouverOnglet(ctx, 'lisezMoi');
    if (!o) return '';
    const pos = chercherTitre(ctx, o.ws, FORMAT_ATTENDU.messagePrincipal.titre);
    if (!pos) { ctx.ajouterProbleme('LISEZ-MOI', 'message principal', 'Le titre « Le message principal » est introuvable dans l’onglet LISEZ-MOI.'); return ''; }
    for (let r = pos.r + 1; r <= pos.r + 5; r++) {
      const t = texteCellule(ctx, cellule(o.ws, r, pos.c));
      if (t) return t;
    }
    ctx.ajouterProbleme('LISEZ-MOI', 'message principal', 'Le message principal est vide dans l’onglet LISEZ-MOI.');
    return '';
  }

  function lireControles(ctx) {
    const o = trouverOnglet(ctx, 'controles');
    const res = { total: null, conformes: null };
    if (!o) return res;
    const def = FORMAT_ATTENDU.controles;
    const plage = plageFeuille(o.ws);
    for (let r = plage.s.r; r <= Math.min(plage.e.r, plage.s.r + 40); r++) {
      for (let c = plage.s.c; c <= Math.min(plage.e.c, plage.s.c + 8); c++) {
        const t = normaliser(texteCellule(ctx, cellule(o.ws, r, c)));
        if (!t) continue;
        const cle = def.total.some(function (s) { return normaliser(s) === t; }) ? 'total' : (def.conformes.some(function (s) { return normaliser(s) === t; }) ? 'conformes' : null);
        if (!cle || res[cle] !== null) continue;
        for (let c2 = c + 1; c2 <= c + 4; c2++) {
          const n = nombreCellule(ctx, cellule(o.ws, r, c2));
          if (n !== null) { res[cle] = n; break; }
        }
      }
    }
    return res;
  }

  function compterCellulesEnErreur(classeur) {
    const parOnglet = [];
    let total = 0;
    for (const nom of classeur.SheetNames || []) {
      const ws = classeur.Sheets[nom];
      if (!ws) continue;
      let n = 0;
      for (const cle of Object.keys(ws)) {
        if (cle.charAt(0) === '!') continue;
        const c = ws[cle];
        if (c && c.t === 'e') n++;
      }
      if (n) { parOnglet.push(nom + ' (' + n + ')'); total += n; }
    }
    return { total: total, parOnglet: parOnglet };
  }

  /* Lecture complète et validation de la structure, via FORMAT_ATTENDU. */
  function extraireModele(classeur) {
    const ctx = creerContexte(classeur);
    for (const cle of Object.keys(FORMAT_ATTENDU.onglets)) {
      const def = FORMAT_ATTENDU.onglets[cle];
      if (def.requis && !trouverOnglet(ctx, cle)) ctx.ajouterProbleme(def.nom, 'onglet', 'Onglet manquant : « ' + def.nom + ' ».');
    }
    indexerNoms(ctx);
    const noms = objetSansPrototype();
    for (const def of FORMAT_ATTENDU.nomsDefinis) noms[def.nom] = lireNomDefini(ctx, def);
    const tft = lireTFT(ctx);
    const kpi = lireKPI(ctx);
    const graphiques = kpi ? lireGraphiques(ctx, kpi.ws) : { radar: [], entonnoir: [], cascade: [], jauges: [] };
    const decision = kpi ? lireDecision(ctx, kpi.ws) : { bfr: [], recommandations: [], avertissement: '' };
    const message = lireMessagePrincipal(ctx);
    const controles = lireControles(ctx);
    const ongletDash = trouverOnglet(ctx, 'dashboard');
    const erreursCellules = compterCellulesEnErreur(classeur);

    if (ctx.problemes.length) throw new ErreurStructure(ctx.problemes);

    /* Les valeurs des KPI viennent des noms définis (ils priment sur le tableau). */
    const kpis = kpi.liste.map(function (k) {
      const defs = FORMAT_ATTENDU.nomsDefinis.filter(function (d) { return d.code === k.code; });
      const d27 = defs.find(function (d) { return /_2027$/.test(d.nom); });
      const d26 = defs.find(function (d) { return /_2026$/.test(d.nom); });
      const copie = Object.assign(objetSansPrototype(), k);
      if (d27 && noms[d27.nom] !== null) copie.v27 = noms[d27.nom];
      if (d26 && noms[d26.nom] !== null) copie.v26 = noms[d26.nom];
      copie.nomDefini = d27 ? d27.nom : '';
      return copie;
    });
    const flux = objetSansPrototype();
    for (const code of ['OT', 'IT', 'FT', 'V', 'T0', 'T1']) {
      flux[code] = { v27: noms['TFT_' + code + '_2027'], v26: noms['TFT_' + code + '_2026'] };
    }
    const params = objetSansPrototype();
    for (const def of FORMAT_ATTENDU.nomsDefinis) if (/^PARAM_/.test(def.nom)) params[def.nom] = noms[def.nom];

    return {
      modele: {
        titre: premierTexte(ctx, ongletDash ? ongletDash.ws : null) || kpi.titre || tft.titre,
        message: message,
        statut: String(noms.STATUT_GLOBAL || ''),
        controles: controles,
        flux: flux,
        tft: tft.lignes,
        kpis: kpis,
        params: params,
        graphiques: graphiques,
        bfr: decision.bfr,
        recommandations: decision.recommandations,
        avertissementRecos: decision.avertissement
      },
      cellulesEnErreur: erreursCellules
    };
  }

  /* Décodage d'un CSV : UTF-8 si possible, sinon Windows-1252. */
  function decoderTexteCSV(octets) {
    let texte;
    try { texte = new TextDecoder('utf-8', { fatal: true }).decode(octets); }
    catch (e) { texte = new TextDecoder('windows-1252').decode(octets); }
    return texte.replace(/^﻿/, '');
  }

  /* Lecture binaire du classeur : valeurs seulement, aucune macro exécutée. */
  function lireClasseur(octets, ext) {
    if (!window.XLSX || typeof window.XLSX.read !== 'function') {
      throw new ErreurLecture('La bibliothèque de lecture Excel n’a pas pu être chargée : vérifiez la connexion Internet puis rechargez la page.');
    }
    let classeur;
    try {
      const options = { cellFormula: true, cellHTML: false, cellText: false, cellStyles: false, cellDates: true, bookVBA: false, bookFiles: false, WTF: false, dense: false };
      if (ext === '.csv') {
        options.type = 'string';
        classeur = window.XLSX.read(decoderTexteCSV(octets), options);
      } else {
        options.type = 'array';
        classeur = window.XLSX.read(octets, options);
      }
    } catch (e) {
      throw new ErreurLecture('Le fichier est incomplet ou endommagé : il n’a pas pu être lu.');
    }
    if (!classeur || !Array.isArray(classeur.SheetNames) || !classeur.SheetNames.length) {
      throw new ErreurLecture('Le fichier ne contient aucun onglet lisible.');
    }
    let lignes = 0;
    for (const nom of classeur.SheetNames) {
      const p = plageFeuille(classeur.Sheets[nom]);
      lignes += Math.max(0, p.e.r - p.s.r + 1);
    }
    if (lignes > LIMITES.lignesMax) {
      throw new ErreurSecurite('Fichier refusé : ' + formatNombre(lignes, 0) + ' lignes pour un maximum de 50 000.');
    }
    if (ext === '.csv') {
      throw new ErreurStructure([{ onglet: 'CSV', element: 'onglets', message: 'Un fichier .csv ne contient qu’un seul onglet et aucun nom défini : utilisez le classeur complet (.xlsx), avec ses onglets TFT, KPI, CONTROLES et LISEZ-MOI.' }]);
    }
    return classeur;
  }

  /* =======================================================================
     4. SYNCHRONISATION · Excel ↔ application (3 modes, choisis tout seuls)
     ======================================================================= */

  const etat = {
    mode: null,                 /* 'A' direct · 'B' en ligne · 'C' import */
    poignee: null,
    poigneeEnAttente: null,
    fichierNom: '',
    derniereMaj: null,
    derniereVerif: 0,
    syncActive: true,
    statut: 'aucun',            /* aucun · lecture · ok · reconnexion · illisible */
    raison: '',
    signature: null,            /* mode A : date + taille */
    empreinteOctets: '',        /* mode B : empreinte des octets */
    empreinteModele: '',
    modele: null,
    problemes: [],
    avertissements: [],
    occupe: false,
    relancer: false,
    premiereLecture: true,
    erreurInitiale: ''
  };

  const API_DIRECTE = typeof window.showOpenFilePicker === 'function';
  const PROTOCOLE_WEB = location.protocol === 'http:' || location.protocol === 'https:';
  const EST_LOCALHOST = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(location.hostname);

  function intervalleMode() {
    if (etat.mode === 'A') return INTERVALLES.direct;
    if (etat.mode === 'B') return EST_LOCALHOST ? INTERVALLES.localhost : INTERVALLES.enLigne;
    return Infinity;
  }
  function libelleMode() {
    if (etat.mode === 'A') return 'Direct';
    if (etat.mode === 'B') return 'En ligne';
    if (etat.mode === 'C') return 'Import';
    return '—';
  }
  function pause(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

  /* Préférence de l'interrupteur (seule donnée gardée dans localStorage). */
  function lirePreferenceSync() {
    try { const v = localStorage.getItem(CLE_SYNC); return v === null ? true : v === '1'; } catch (e) { return true; }
  }
  function ecrirePreferenceSync(v) {
    try { localStorage.setItem(CLE_SYNC, v ? '1' : '0'); } catch (e) { /* navigation privée : on continue */ }
  }

  /* IndexedDB : on garde la poignée du fichier, jamais son contenu. */
  function ouvrirBase() {
    return new Promise(function (ok, ko) {
      try {
        if (!window.indexedDB) { ko(new Error('indisponible')); return; }
        const req = indexedDB.open(BASE_IDB, 1);
        req.onupgradeneeded = function () { req.result.createObjectStore(MAGASIN_IDB); };
        req.onsuccess = function () { ok(req.result); };
        req.onerror = function () { ko(req.error); };
      } catch (e) { ko(e); }
    });
  }
  async function idb(operation, valeur) {
    try {
      const base = await ouvrirBase();
      return await new Promise(function (ok, ko) {
        const tx = base.transaction(MAGASIN_IDB, operation === 'lire' ? 'readonly' : 'readwrite');
        const magasin = tx.objectStore(MAGASIN_IDB);
        const req = operation === 'lire' ? magasin.get(CLE_POIGNEE) : (operation === 'ecrire' ? magasin.put(valeur, CLE_POIGNEE) : magasin.delete(CLE_POIGNEE));
        req.onsuccess = function () { ok(req.result); };
        req.onerror = function () { ko(req.error); };
        tx.oncomplete = function () { base.close(); };
      });
    } catch (e) { return null; }
  }

  async function empreinteSHA256(donnees) {
    const octets = typeof donnees === 'string' ? new TextEncoder().encode(donnees) : donnees;
    if (window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function') {
      try {
        const h = await crypto.subtle.digest('SHA-256', octets);
        return Array.from(new Uint8Array(h)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      } catch (e) { /* repli ci-dessous */ }
    }
    let h1 = 0x811c9dc5, h2 = 0;
    for (let i = 0; i < octets.length; i++) { h1 ^= octets[i]; h1 = Math.imul(h1, 16777619) >>> 0; h2 = (h2 + octets[i] * (i + 1)) >>> 0; }
    return 'fnv' + h1.toString(16) + h2.toString(16) + octets.length;
  }

  function changerStatut(statut, raison) {
    etat.statut = statut;
    etat.raison = raison || '';
    afficherSync();
  }

  /* Traite un fichier lu : sécurité → lecture → validation → remplacement. */
  async function traiterOctets(octets, nom, taille) {
    const ext = verifierFichier(nom, taille, octets);
    const classeur = lireClasseur(octets, ext);
    const resultat = extraireModele(classeur);
    const modele = resultat.modele;
    const empreinte = await empreinteSHA256(JSON.stringify(modele));
    const avertissements = [];
    if (resultat.cellulesEnErreur.total) {
      avertissements.push(resultat.cellulesEnErreur.total + ' cellule(s) en erreur (#N/A, #DIV/0!…) traitée(s) comme vide(s) : ' + resultat.cellulesEnErreur.parOnglet.join(', ') + '.');
    }
    etat.avertissements = avertissements;
    etat.problemes = [];
    etat.fichierNom = nom;
    etat.erreurInitiale = '';
    const ancien = etat.modele;
    if (empreinte === etat.empreinteModele) {
      changerStatut('ok');
      afficherAlertes();
      return;
    }
    etat.modele = modele;
    etat.empreinteModele = empreinte;
    etat.derniereMaj = new Date();
    changerStatut('ok');
    const changements = ancien ? compterChangements(ancien, modele) : null;
    rendre({ conserverDefilement: true });
    if (ancien) {
      toast('Données mises à jour à ' + heureCourte(etat.derniereMaj) + ' : ' + changements.total + ' valeur' + (changements.total > 1 ? 's modifiées' : ' modifiée'), 'succes');
      illuminerKPI(changements.kpis);
    } else {
      toast('Données chargées : ' + nom, 'succes');
    }
  }

  /* Gestion uniforme des erreurs : les dernières données valides restent. */
  function signalerErreur(e) {
    if (e instanceof ErreurStructure) {
      etat.problemes = e.problemes;
      const premier = e.problemes[0];
      changerStatut('illisible', premier ? premier.message : 'Structure non conforme.');
    } else if (e instanceof ErreurSecurite || e instanceof ErreurLecture) {
      etat.problemes = [{ onglet: '', element: '', message: e.message }];
      changerStatut('illisible', e.message);
    } else {
      etat.problemes = [{ onglet: '', element: '', message: 'Le fichier n’a pas pu être lu.' }];
      changerStatut('illisible', 'Le fichier n’a pas pu être lu.');
    }
    if (!etat.modele) etat.erreurInitiale = etat.raison;
    afficherAlertes();
    if (!etat.modele) rendre();
  }

  /* --- Mode A · Direct : File System Access, lecture seule --- */
  async function verifierModeA() {
    const poignee = etat.poignee;
    if (!poignee) return;
    let fichier;
    try { fichier = await poignee.getFile(); }
    catch (e) { gererErreurPoignee(e); return; }
    if (etat.signature && etat.signature.date === fichier.lastModified && etat.signature.taille === fichier.size) {
      if (etat.statut === 'reconnexion' || etat.statut === 'lecture') changerStatut('ok');
      return;
    }
    changerStatut('lecture');
    /* Pendant l'enregistrement d'Excel : attendre que date et taille soient stables. */
    let stable = null;
    for (let essai = 0; essai < 10 && !stable; essai++) {
      await pause(ATTENTE_ENREGISTREMENT);
      let f2;
      try { f2 = await poignee.getFile(); } catch (e) { gererErreurPoignee(e); return; }
      if (f2.lastModified === fichier.lastModified && f2.size === fichier.size) stable = f2;
      else fichier = f2;
    }
    if (!stable) stable = fichier;
    let derniereErreur = null;
    for (let tentative = 0; tentative <= REPRISES; tentative++) {
      try {
        const f = tentative === 0 ? stable : await poignee.getFile();
        const octets = new Uint8Array(await f.arrayBuffer());
        etat.signature = { date: f.lastModified, taille: f.size };
        await traiterOctets(octets, f.name, f.size);
        return;
      } catch (e) {
        derniereErreur = e;
        const reprenable = e instanceof ErreurLecture || (e && e.name === 'NotReadableError');
        if (!reprenable || tentative === REPRISES) break;
        await pause(DELAI_REPRISE);
      }
    }
    if (derniereErreur && derniereErreur.name === 'NotReadableError') {
      signalerErreur(new ErreurLecture('Fichier illisible pour le moment : Excel est peut-être encore en train de l’enregistrer.'));
    } else if (derniereErreur && (derniereErreur.name === 'NotFoundError' || derniereErreur.name === 'NotAllowedError' || derniereErreur.name === 'SecurityError')) {
      gererErreurPoignee(derniereErreur);
    } else {
      signalerErreur(derniereErreur);
    }
  }
  function gererErreurPoignee(e) {
    const nom = e && e.name;
    let raison = 'Le fichier n’est plus accessible.';
    if (nom === 'NotFoundError') raison = 'Fichier introuvable : il a peut-être été déplacé, renommé ou supprimé.';
    else if (nom === 'NotAllowedError' || nom === 'SecurityError') raison = 'L’autorisation de lire le fichier a été retirée.';
    else if (nom === 'NotReadableError') raison = 'Le fichier n’est pas lisible pour le moment (ordinateur sorti de veille ?).';
    changerStatut('reconnexion', raison);
  }

  /* --- Mode B · En ligne : relecture de donnees.xlsx --- */
  async function verifierModeB(silencieux) {
    let reponse;
    try {
      reponse = await fetch(NOM_FICHIER_EN_LIGNE, { cache: 'no-cache', credentials: 'same-origin', redirect: 'error' });
    } catch (e) {
      if (!etat.modele && !silencieux) { etat.mode = API_DIRECTE ? null : 'C'; changerStatut('aucun'); rendre(); }
      return false;
    }
    if (!reponse.ok) {
      if (!etat.modele) { etat.mode = API_DIRECTE ? null : 'C'; changerStatut('aucun'); rendre(); }
      return false;
    }
    const longueur = Number(reponse.headers.get('content-length') || 0);
    if (longueur > LIMITES.tailleMax) { signalerErreur(new ErreurSecurite('Fichier refusé : ' + formatTaille(longueur) + ' pour un maximum de 10 Mo.')); return true; }
    const octets = new Uint8Array(await reponse.arrayBuffer());
    const empreinte = await empreinteSHA256(octets);
    if (empreinte === etat.empreinteOctets) { if (etat.statut === 'lecture') changerStatut('ok'); return true; }
    if (etat.statut !== 'reconnexion') changerStatut('lecture');
    try {
      await traiterOctets(octets, NOM_FICHIER_EN_LIGNE, octets.length);
      etat.empreinteOctets = empreinte;
    } catch (e) {
      etat.empreinteOctets = empreinte;
      signalerErreur(e);
    }
    if (etat.poigneeEnAttente) changerStatut('reconnexion', 'Le navigateur demande à nouveau l’autorisation de lire « ' + (etat.poigneeEnAttente.name || 'votre fichier') + ' ».');
    return true;
  }

  /* --- Boucle de vérification unique (pas de chevauchement) --- */
  async function verifierMaintenant() {
    if (etat.occupe) { etat.relancer = true; return; }
    etat.occupe = true;
    try {
      do {
        etat.relancer = false;
        etat.derniereVerif = Date.now();
        if (etat.mode === 'A') await verifierModeA();
        else if (etat.mode === 'B') await verifierModeB(true);
      } while (etat.relancer && etat.syncActive);
    } catch (e) {
      signalerErreur(e);
    } finally {
      etat.occupe = false;
    }
  }
  function battement() {
    mettreAJourHorloge();
    if (!etat.syncActive || document.hidden) return;
    if (etat.mode !== 'A' && etat.mode !== 'B') return;
    if (etat.mode === 'A' && etat.statut === 'reconnexion') return;
    if (Date.now() - etat.derniereVerif >= intervalleMode()) verifierMaintenant();
  }

  /* --- Actions de l'utilisateur --- */
  async function connecterFichier() {
    if (!API_DIRECTE) { ouvrirImport(); return; }
    let poignees;
    try {
      poignees = await window.showOpenFilePicker({
        multiple: false,
        excludeAcceptAllOption: false,
        types: [{ description: 'Classeur Excel', accept: {
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'],
          'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm'],
          'application/vnd.ms-excel': ['.xls'],
          'text/csv': ['.csv']
        } }]
      });
    } catch (e) {
      if (e && e.name === 'AbortError') return; /* l'utilisateur a annulé */
      ouvrirImport();
      return;
    }
    if (poignees && poignees[0]) await brancherPoignee(poignees[0]);
  }
  async function brancherPoignee(poignee) {
    const ext = extensionDe(poignee.name);
    if (!EXTENSIONS.includes(ext)) {
      signalerErreur(new ErreurSecurite('Format refusé : seuls les fichiers .xlsx, .xlsm, .xls et .csv sont acceptés.'));
      return;
    }
    etat.poignee = poignee;
    etat.poigneeEnAttente = null;
    etat.mode = 'A';
    etat.signature = null;
    etat.fichierNom = poignee.name;
    await idb('ecrire', poignee);
    changerStatut('lecture');
    etat.derniereVerif = 0;
    await verifierMaintenant();
  }
  async function reconnecter() {
    const poignee = etat.poigneeEnAttente || etat.poignee;
    if (!poignee) { await connecterFichier(); return; }
    try {
      let perm = 'granted';
      if (typeof poignee.queryPermission === 'function') perm = await poignee.queryPermission({ mode: 'read' });
      if (perm !== 'granted' && typeof poignee.requestPermission === 'function') perm = await poignee.requestPermission({ mode: 'read' });
      if (perm !== 'granted') { changerStatut('reconnexion', 'Autorisation refusée : cliquez à nouveau sur « Reconnecter » et choisissez « Autoriser ».'); return; }
      await poignee.getFile();
    } catch (e) {
      if (e && e.name === 'NotFoundError') { await connecterFichier(); return; }
      gererErreurPoignee(e);
      return;
    }
    etat.poignee = poignee;
    etat.poigneeEnAttente = null;
    etat.mode = 'A';
    etat.signature = null;
    changerStatut('lecture');
    etat.derniereVerif = 0;
    await verifierMaintenant();
  }
  function ouvrirImport() {
    const entree = document.getElementById('choix-fichier');
    entree.value = '';
    entree.click();
  }
  async function importerFichier(fichier) {
    if (!fichier) return;
    etat.mode = 'C';
    etat.poigneeEnAttente = null;
    changerStatut('lecture');
    try {
      verifierFichier(fichier.name, fichier.size, null);
      const octets = new Uint8Array(await fichier.arrayBuffer());
      await traiterOctets(octets, fichier.name, fichier.size);
    } catch (e) {
      signalerErreur(e);
    }
  }
  function basculerSync() {
    etat.syncActive = !etat.syncActive;
    ecrirePreferenceSync(etat.syncActive);
    afficherSync();
    if (etat.syncActive) { etat.derniereVerif = 0; verifierMaintenant(); toast('Synchronisation activée : vérification immédiate.', 'info'); }
    else toast('Synchronisation en pause : les données affichées restent figées.', 'info');
  }
  async function effacerDonnees() {
    await idb('supprimer');
    try { localStorage.removeItem(CLE_SYNC); } catch (e) { /* rien */ }
    etat.poignee = null;
    etat.poigneeEnAttente = null;
    etat.signature = null;
    if (etat.mode === 'A') etat.mode = PROTOCOLE_WEB ? 'B' : (etat.modele ? 'C' : null);
    if (etat.statut === 'reconnexion') changerStatut(etat.modele ? 'ok' : 'aucun');
    afficherSync();
    toast('Le fichier connecté et vos préférences ont été effacés de ce navigateur.', 'info');
  }

  /* =======================================================================
     5. CALCULS · une fonction simple par calcul, facile à vérifier
     ======================================================================= */

  function estNombre(v) { return typeof v === 'number' && Number.isFinite(v); }
  function ligneTFT(m, code) { return m.tft.find(function (l) { return l.code === code; }) || { v27: null, v26: null }; }
  function valeurTFT(m, code, an) { const l = ligneTFT(m, code); return an === 2027 ? l.v27 : l.v26; }
  function kpiParCode(m, code) { return m.kpis.find(function (k) { return k.code === code; }) || null; }

  /* K03 · Free cash-flow avant loyers = OT + I1 + I2 */
  function calculerFCF(m, an) { return valeurTFT(m, 'OT', an) + valeurTFT(m, 'I1', an) + valeurTFT(m, 'I2', an); }
  /* K04 · Free cash-flow après loyers = K03 + F4 + F5 */
  function calculerFCFApresLoyers(m, an) { return calculerFCF(m, an) + valeurTFT(m, 'F4', an) + valeurTFT(m, 'F5', an); }
  /* K13 · Couverture du service de la dette = OT ÷ (remboursements + intérêts + loyers) */
  function calculerDSCR(m, an) {
    const service = -(valeurTFT(m, 'F2', an) + valeurTFT(m, 'F3', an) + valeurTFT(m, 'F4', an) + valeurTFT(m, 'F5', an));
    return service ? valeurTFT(m, 'OT', an) / service : null;
  }
  /* K14 · Couverture des dividendes = K03 ÷ dividendes versés */
  function calculerCouvertureDividendes(m, an) { const div = -valeurTFT(m, 'F6', an); return div ? calculerFCF(m, an) / div : null; }
  /* EBITDA 2027 : première étape de l'entonnoir (KPI, section 4) */
  function ebitda2027(m) { const e = m.graphiques.entonnoir[0]; return e && estNombre(e.valeur) ? e.valeur : null; }
  /* K01 · Conversion de l'EBITDA en cash = OT ÷ EBITDA */
  function calculerConversion(m) { const e = ebitda2027(m); return e ? valeurTFT(m, 'OT', 2027) / e : null; }
  /* K11 · Dette nette ÷ EBITDA = K10 ÷ EBITDA */
  function calculerLevier(m) { const e = ebitda2027(m); const dn = kpiParCode(m, 'K10'); return e && dn && estNombre(dn.v27) ? dn.v27 / e : null; }
  /* K09 · Cycle de cash = K06 + K07 − K08 */
  function calculerCycleCash(m, an) {
    const cle = an === 2027 ? 'v27' : 'v26';
    const a = kpiParCode(m, 'K06'), b = kpiParCode(m, 'K07'), c = kpiParCode(m, 'K08');
    return a && b && c && estNombre(a[cle]) && estNombre(b[cle]) && estNombre(c[cle]) ? a[cle] + b[cle] - c[cle] : null;
  }
  /* V = OT + IT + FT ; T1 = T0 + V */
  function calculerVariation(m, an) { return valeurTFT(m, 'OT', an) + valeurTFT(m, 'IT', an) + valeurTFT(m, 'FT', an); }
  function calculerTresorerieCloture(m, an) { return valeurTFT(m, 'T0', an) + valeurTFT(m, 'V', an); }

  /* Vérification interne : chaque valeur affichée est comparée à un calcul refait. */
  function verifierCalculs(m) {
    const k = function (code, an) { const x = kpiParCode(m, code); return x ? (an === 2027 ? x.v27 : x.v26) : null; };
    const f = function (code, an) { return m.flux[code] ? (an === 2027 ? m.flux[code].v27 : m.flux[code].v26) : null; };
    const controles = [
      ['K01 Conversion en cash 2027', calculerConversion(m), k('K01', 2027)],
      ['K03 Free cash-flow 2027', calculerFCF(m, 2027), k('K03', 2027)],
      ['K03 Free cash-flow 2026', calculerFCF(m, 2026), k('K03', 2026)],
      ['K04 Free cash-flow après loyers 2027', calculerFCFApresLoyers(m, 2027), k('K04', 2027)],
      ['K09 Cycle de cash 2027', calculerCycleCash(m, 2027), k('K09', 2027)],
      ['K09 Cycle de cash 2026', calculerCycleCash(m, 2026), k('K09', 2026)],
      ['K11 Dette nette ÷ EBITDA 2027', calculerLevier(m), k('K11', 2027)],
      ['K13 Couverture de la dette 2027', calculerDSCR(m, 2027), k('K13', 2027)],
      ['K13 Couverture de la dette 2026', calculerDSCR(m, 2026), k('K13', 2026)],
      ['K14 Couverture des dividendes 2027', calculerCouvertureDividendes(m, 2027), k('K14', 2027)],
      ['K14 Couverture des dividendes 2026', calculerCouvertureDividendes(m, 2026), k('K14', 2026)],
      ['V Variation de la trésorerie 2027', calculerVariation(m, 2027), f('V', 2027)],
      ['T1 Trésorerie nette à la clôture 2027', calculerTresorerieCloture(m, 2027), f('T1', 2027)]
    ];
    return controles.map(function (c) {
      const ok = !estNombre(c[1]) || !estNombre(c[2]) || Math.abs(c[1] - c[2]) <= Math.max(0.5, Math.abs(c[2]) * 1e-6) || (Math.abs(c[2]) < 1000 && Math.abs(c[1] - c[2]) < 0.005);
      return { nom: c[0], calcule: c[1], fichier: c[2], ok: ok };
    });
  }

  /* Feu le plus sévère d'une famille. */
  function feuFamille(m, famille) {
    let pire = 'aucun';
    for (const code of famille.kpis) {
      const k = kpiParCode(m, code);
      if (k && FEUX[k.feu27].rang > FEUX[pire].rang) pire = k.feu27;
    }
    return pire;
  }
  function familleDuKPI(code) { return FAMILLES.find(function (f) { return f.kpis.includes(code); }) || null; }

  /* Repli si les recommandations manquent : règles simples, aucune IA. */
  function pointsAttention(m) {
    const points = [];
    const k = function (code) { const x = kpiParCode(m, code); return x && estNombre(x.v27) ? x.v27 : null; };
    const p = m.params;
    if (k('K03') !== null && k('K03') <= 0) points.push('Le free cash-flow 2027 est négatif (' + formatValeur(k('K03'), 'DH') + ') : les investissements dépassent le cash d’exploitation.');
    if (k('K11') !== null && estNombre(p.PARAM_PLAFOND) && k('K11') > p.PARAM_PLAFOND) points.push('La dette nette vaut ' + formatValeur(k('K11'), 'fois') + ' l’EBITDA, au-dessus du plafond bancaire de ' + formatNombre(p.PARAM_PLAFOND, 2) + '.');
    if (k('K14') !== null && k('K14') < 1) points.push('Le dividende n’est pas couvert par le cash libre : couverture de ' + formatValeur(k('K14'), 'fois') + '.');
    if (k('K13') !== null && estNombre(p.PARAM_CIBLE_DSCR) && k('K13') < p.PARAM_CIBLE_DSCR) points.push('La couverture du service de la dette (' + formatValeur(k('K13'), 'fois') + ') est sous son seuil de ' + formatNombre(p.PARAM_CIBLE_DSCR, 2) + '.');
    if (k('K09') !== null && estNombre(p.PARAM_CIBLE_CCC) && k('K09') > p.PARAM_CIBLE_CCC) points.push('Le cycle de cash (' + formatValeur(k('K09'), 'jours') + ') dépasse la cible de ' + formatNombre(p.PARAM_CIBLE_CCC, 0) + ' jours.');

  /* Résumé du changement : nombre de valeurs modifiées et KPI touchés. */

  /* --- Nombres à la française : espace pour les milliers, virgule, signe − --- */
  function formatNombre(n, decimales) {
    if (!estNombre(n)) return String(n === null || n === undefined ? '—' : n);
    const negatif = n < 0 && Math.abs(n) >= 0.5 * Math.pow(10, -decimales);
    const fixe = Math.abs(n).toFixed(decimales);
    const parts = fixe.split('.');
    const entier = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (negatif ? '− ' : '') + entier + (parts[1] ? ',' + parts[1] : '');
  }
  function typeUnite(unite) {

    if (u === 'FOIS' || u === 'X') return 'fois';
    return 'ratio';

  function partiesValeur(v, unite) {
    if (!estNombre(v)) return { nombre: v === null || v === undefined ? '—' : String(v), unite: '' };
    const t = typeUnite(unite);
    if (t === 'montant') return { nombre: formatNombre(v / 1000, 1), unite: 'k MAD', brut: v / 1000, decimales: 1 };
    if (t === 'jours') return { nombre: formatNombre(v, 1), unite: 'j', brut: v, decimales: 1 };
    if (t === 'fois') return { nombre: formatNombre(v, 2), unite: '×', brut: v, decimales: 2 };
    return { nombre: formatNombre(v, 2), unite: '', brut: v, decimales: 2 };
  }
  function formatValeur(v, unite) { const p = partiesValeur(v, unite); return p.unite ? p.nombre + ' ' + p.unite : p.nombre; }

  function formatKMAD(v) { return estNombre(v) ? formatNombre(v / 1000, 1) : '—'; }
  function heureCourte(d) { return d ? String(d.getHours()).padStart(2, '0') + ' h ' + String(d.getMinutes()).padStart(2, '0') : '—'; }

    if (mn < 60) return 'il y a ' + mn + ' min';

  }

  /* --- Chiffres qui montent (désactivé si « réduire les animations ») --- */
  function animerChiffre(noeud, cible, decimales, diviseur) {
    if (reduireAnimations.matches || !estNombre(cible)) return;
    const debut = performance.now(), duree = 900;
    function pas(t) {
      const p = Math.min(1, (t - debut) / duree);
      const e = 1 - Math.pow(1 - p, 3);
      noeud.textContent = formatNombre(cible * e / (diviseur || 1), decimales);
      if (p < 1) requestAnimationFrame(pas);
      else noeud.textContent = formatNombre(cible / (diviseur || 1), decimales);
    }
    requestAnimationFrame(pas);
  }

    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Tendance : ' + points.map(function (p) { return p.an + ' ' + formatValeur(p.v, k.unite); }).join(', '));
    if (!points.length) return svg;
    const min = Math.min.apply(null, points.map(function (p) { return p.v; }));
    const max = Math.max.apply(null, points.map(function (p) { return p.v; }));
    const y = function (v) { return max === min ? 20 : 34 - (v - min) / (max - min) * 28; };
    const x = function (i) { return points.length === 1 ? 232 : 8 + i * (224 / (points.length - 1)); };
    if (points.length > 1) {
      const ligne = document.createElementNS(NS_SVG, 'polyline');
      ligne.setAttribute('points', points.map(function (p, i) { return x(i) + ',' + y(p.v); }).join(' '));
      ligne.setAttribute('fill', 'none');
      ligne.setAttribute('stroke', PALETTE.or);
      ligne.setAttribute('stroke-width', '1.25');
      ligne.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(ligne);
    }
    const dernier = points[points.length - 1];
    const point = document.createElementNS(NS_SVG, 'circle');
    point.setAttribute('cx', String(x(points.length - 1)));
    point.setAttribute('cy', String(y(dernier.v)));
    point.setAttribute('r', '3');
    point.setAttribute('fill', PALETTE.or);
    svg.appendChild(point);
    return svg;
  }

  /* Export Excel : formules piégées neutralisées. */
  function exporterTFT(m) {
    if (!window.XLSX || !window.XLSX.utils) { toast('Export impossible : la bibliothèque Excel n’est pas chargée.', 'erreur'); return; }
    const lignes = [
      [neutraliserCellule('ATLAS DISTRIBUTION SA · Tableau des flux de trésorerie IFRS · méthode indirecte · en milliers de dirhams (k MAD)')],
      [],
      ['Ligne', 'Libellé', '2027', '2026', 'Note']
    ];
    for (const l of m.tft) {
      if (l.type === 'titre') lignes.push(['', neutraliserCellule(l.libelle), '', '', '']);
      else lignes.push([neutraliserCellule(l.code), neutraliserCellule(l.libelle), estNombre(l.v27) ? l.v27 / 1000 : '', estNombre(l.v26) ? l.v26 / 1000 : '', neutraliserCellule(l.note || '')]);
    }
    const ws = window.XLSX.utils.aoa_to_sheet(lignes);
    for (const cle of Object.keys(ws)) {
      if (cle.charAt(0) === '!') continue;
      const c = ws[cle];
      if (c && c.t === 'n') c.z = '#,##0.0;-#,##0.0';
      if (c && c.t === 's') c.v = neutraliserCellule(c.v);
    }
    ws['!cols'] = [{ wch: 8 }, { wch: 70 }, { wch: 14 }, { wch: 14 }, { wch: 30 }];
    const classeur = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(classeur, ws, 'TFT');
    try {
      window.XLSX.writeFile(classeur, 'TFT-ATLAS-2027.xlsx', { compression: true });
      toast('Export Excel prêt : TFT-ATLAS-2027.xlsx', 'succes');
    } catch (e) { toast('L’export n’a pas pu être créé.', 'erreur'); }
  }

  function vueKPI(m, code, animer) {
    const k = kpiParCode(m, code);
    const page = el('div');
    if (!k) { page.appendChild(el('p', { texte: 'KPI introuvable dans le fichier : ' + code + '.' })); return page; }
    const f = familleDuKPI(code);
    page.appendChild(el('div', { class: 'entete-page' }, [el('div', null, [el('p', { class: 'surtitre', texte: k.code + (f ? ' · ' + f.nom : '') }), el('h1', { texte: k.nomCourt })])]));
    const carte = carteKPI(k, animer);
    carte.appendChild(el('div', { class: 'feux-detail' }, [el('span', { texte: 'Feu 2027 :' }), pastille(k.feu27), el('span', { texte: 'Feu 2026 :' }), pastille(k.feu26)]));
    page.appendChild(el('div', { class: 'grille-kpi' }, [carte, dictionnaireKPI(k)]));
    if (f && f.kpis.length > 1) {

        return el('a', { class: 'btn btn-secondaire btn-petit', href: '#/kpi/' + c, texte: c + ' · ' + (x ? x.nomCourt : '') });

  function dictionnaireKPI(k) {

      el('div', { class: 'plein' }, [el('dt', { texte: 'Seuils' }), el('dd', null, el('div', { class: 'seuils' }, [
        el('span', { class: 'pastille vert' }, [icone('coche'), 'Vert : ' + (d.vert || '–')]),
        el('span', { class: 'pastille orange' }, [icone('alerte'), 'Orange (« ambre ») : ' + (d.ambre || '–')]),

      ]))]),

  /* --- Rendu général, en conservant onglet, sélection et défilement --- */
  function rendre(options) {
    const route = routeCourante();
    const cle = cleRoute(route);
    const garderDefilement = options && options.conserverDefilement && cle === premierAffichageVue;
    const y = window.scrollY;
    const focus = memoriserFocus();
    const m = etat.modele;
    detruireGraphiques();
    afficherNav();
    afficherOnglets();
    afficherAriane(route);
    afficherAlertes();
    const vue = document.getElementById('vue');
    let contenu;
    const animer = cle !== premierAffichageVue && !(options && options.conserverDefilement);
    if (!m) {
      if (etat.statut === 'lecture' || etat.premiereLecture) contenu = vueChargement();
      else if (etat.erreurInitiale) contenu = vueErreur();
      else contenu = vueVide();
    } else if (donneesBloquees()) contenu = vueDisjoncteur(m);
    else if (route.ecran === 'familles') contenu = vueFamilles(m);
    else if (route.ecran === 'famille') contenu = vueFamille(m, route.id, animer);
    else if (route.ecran === 'kpi') contenu = vueKPI(m, route.id, animer);
    else contenu = vueSituation(m, animer);
    vue.replaceChildren(contenu);
    document.title = 'ATLAS DISTRIBUTION SA · ' + (route.ecran === 'situation' ? 'Situation TFT' : 'Les KPI par famille');
    const jeton = ++jetonRendu;
    if (m && !donneesBloquees()) requestAnimationFrame(function () { if (jeton === jetonRendu) dessinerGraphiques(m); });
    if (garderDefilement) window.scrollTo(0, y);
    else if (cle !== premierAffichageVue && premierAffichageVue) window.scrollTo(0, 0);
    if (m) premierAffichageVue = cle;
    restaurerFocus(focus);
  }

  /* =======================================================================
     7. GRAPHIQUES (Apache ECharts, infobulles en texte simple, jamais en HTML)
     ======================================================================= */

  const graphiques = [];
  let jetonRendu = 0; /* seul le dernier rendu dessine ses graphiques */
  function detruireGraphiques() {
    while (graphiques.length) {
      const g = graphiques.pop();
      try { if (g.observateur) g.observateur.disconnect(); g.instance.dispose(); } catch (e) { /* rien */ }
    }
  }
  function optionsCommunes() {
    return {
      backgroundColor: 'transparent',
      animation: !reduireAnimations.matches,
      animationDuration: 900,
      animationEasing: 'cubicOut',
      textStyle: { fontFamily: 'Inter, system-ui, sans-serif', color: PALETTE.texte, fontWeight: 300 },
      aria: { enabled: false },
      tooltip: {
        renderMode: 'richText', confine: true, backgroundColor: 'rgba(5,5,5,0.95)', borderColor: 'rgba(255,255,255,0.18)', borderWidth: 1,
        textStyle: { color: '#FFFFFF', fontFamily: 'Inter, system-ui, sans-serif', fontSize: 13 }, padding: [8, 12]
      }
    };
  }
  function creerGraphique(noeud, option, description) {
    if (!window.echarts || !noeud) return null;
    noeud.setAttribute('aria-label', description);
    if (typeof window.echarts.getInstanceByDom === 'function') { const ancien = window.echarts.getInstanceByDom(noeud); if (ancien) ancien.dispose(); }
    const instance = window.echarts.init(noeud, null, { renderer: 'canvas' });
    instance.setOption(Object.assign(optionsCommunes(), option));
    let observateur = null;
    if (typeof ResizeObserver === 'function') {
      observateur = new ResizeObserver(function () { try { instance.resize(); } catch (e) { /* rien */ } });
      observateur.observe(noeud);
    }
    graphiques.push({ instance: instance, observateur: observateur });
    return instance;
  }
  function dessinerGraphiques(m) {
    if (!window.echarts) {
      document.querySelectorAll('[data-graphique]').forEach(function (n) { n.replaceChildren(el('p', { class: 'legende', texte: 'Graphique indisponible : la bibliothèque ECharts n’a pas pu être chargée (vérifiez la connexion Internet).' })); });
      return;
    }
    document.querySelectorAll('[data-graphique]').forEach(function (n) {
      const type = n.getAttribute('data-graphique');
      try {
        if (type === 'cascade') graphCascade(n, m);
        else if (type === 'sankey') graphSankey(n, m);
        else if (type === 'entonnoir') graphEntonnoir(n, m);
        else if (type === 'jauge') graphJauge(n, m, Number(n.getAttribute('data-index')));
        else if (type === 'radar') graphRadar(n, m);
        else if (type === 'bullet') graphBullet(n, m);
      } catch (e) {
        n.replaceChildren(el('p', { class: 'legende', texte: 'Ce graphique n’a pas pu être dessiné avec les données du fichier.' }));
      }
    });
  }
  function signeKMAD(v) { return (v > 0 ? '+ ' : '') + formatNombre(v, 1); }
  function couperLibelle(t, max) {
    const mots = String(t).split(' ');
    const lignes = [''];
    for (const mot of mots) {
      if ((lignes[lignes.length - 1] + ' ' + mot).trim().length > max) lignes.push(mot);
      else lignes[lignes.length - 1] = (lignes[lignes.length - 1] + ' ' + mot).trim();
    }
    return lignes.join('\n');
  }
  const POLICE_CHIFFRES = '400 13px Cinzel, Georgia, serif';

  /* Cascade : trésorerie 2026 → + opérationnel → − investissement → + financement → trésorerie 2027 */
  function graphCascade(n, m) {
    const rows = m.graphiques.cascade;
    const dernier = rows.length - 1;
    const donnees = rows.map(function (r, i) {
      const debut = (r.debut || 0) / 1000, fin = (r.fin || 0) / 1000;
      const total = (i === 0 || i === dernier) && (r.debut || 0) === 0;
      return { value: [i, debut, fin], nature: total ? 'total' : (fin >= debut ? 'entree' : 'sortie'), libelle: r.libelle };
    });
    const couleur = { total: PALETTE.blanc, entree: PALETTE.or, sortie: PALETTE.grenat };
    creerGraphique(n, {
      grid: { left: 8, right: 8, top: 36, bottom: 8, containLabel: true },
      xAxis: { type: 'category', data: rows.map(function (r) { return couperLibelle(r.libelle, 14); }), axisLine: { lineStyle: { color: PALETTE.axe } }, axisTick: { show: false }, axisLabel: { color: PALETTE.texte, fontSize: 12, interval: 0, lineHeight: 15 } },
      yAxis: { type: 'value', axisLabel: { color: PALETTE.texteDoux, formatter: function (v) { return formatNombre(v, 0); } }, splitLine: { lineStyle: { color: PALETTE.grille } } },
      tooltip: Object.assign(optionsCommunes().tooltip, { trigger: 'item', formatter: function (p) { const d = donnees[p.dataIndex]; const delta = d.value[2] - d.value[1]; return d.libelle + '\n' + (d.nature === 'total' ? formatNombre(d.value[2], 1) : signeKMAD(delta)) + ' k MAD'; } }),
      series: [{
        type: 'custom',
        encode: { x: 0, y: [1, 2] },
        data: donnees,
        renderItem: function (params, api) {
          const i = api.value(0), debut = api.value(1), fin = api.value(2);
          const p1 = api.coord([i, debut]), p2 = api.coord([i, fin]);
          const largeur = api.size([1, 0])[0] * 0.56;
          const haut = Math.min(p1[1], p2[1]), bas = Math.max(p1[1], p2[1]);
          const d = donnees[params.dataIndex];
          const montant = d.nature === 'total' ? formatNombre(fin, 1) : signeKMAD(fin - debut);
          const enDessous = Math.max(debut, fin) <= 0;
          return { type: 'group', children: [
            { type: 'rect', shape: { x: p1[0] - largeur / 2, y: haut, width: largeur, height: Math.max(2, bas - haut), r: 3 }, style: { fill: couleur[d.nature] } },
            { type: 'text', style: { text: montant, x: p1[0], y: enDessous ? bas + 6 : haut - 6, fill: d.nature === 'sortie' ? '#FF8A9B' : (d.nature === 'total' ? '#FFFFFF' : PALETTE.or), font: POLICE_CHIFFRES, align: 'center', verticalAlign: enDessous ? 'top' : 'bottom' } }
          ] };
        }
      }]
    }, 'Cascade de la trésorerie : ' + rows.map(function (r, i) { return r.libelle + ' ' + (donnees[i].nature === 'total' ? formatKMAD(r.fin) : signeKMAD(((r.fin || 0) - (r.debut || 0)) / 1000)) + ' k MAD'; }).join(' ; '));
  }

  /* Sankey : d'où vient l'argent et où il va (onglet TFT) */
  function graphSankey(n, m) {
    const v = function (code) { return valeurTFT(m, code, 2027) || 0; };
    const sources = [], emplois = [];
    const ajouter = function (nom, montant) { if (montant > 0) sources.push({ nom: nom, montant: montant }); else if (montant < 0) emplois.push({ nom: nom, montant: -montant }); };
    ajouter('Flux opérationnel', v('OT'));
    ajouter('Emprunts reçus', v('F1'));
    ajouter('Investissements', v('IT'));
    ajouter('Remboursements d’emprunts', v('F2'));
    ajouter('Intérêts', v('F3'));
    ajouter('Loyers IFRS 16', v('F4') + v('F5'));
    ajouter('Dividendes', v('F6'));
    const variation = m.flux.V.v27 || 0;
    if (variation < 0) sources.push({ nom: 'Baisse de la trésorerie', montant: -variation });
    else if (variation > 0) emplois.push({ nom: 'Hausse de la trésorerie', montant: variation });
    const centre = 'Cash mobilisé en 2027';
    const totalCentre = sources.reduce(function (s, x) { return s + x.montant; }, 0);
    const montants = new Map();
    const noeuds = [{ name: centre, itemStyle: { color: PALETTE.blanc }, label: { position: 'top', color: '#FFFFFF' } }];
    montants.set(centre, totalCentre);
    sources.forEach(function (s) { noeuds.push({ name: s.nom, itemStyle: { color: PALETTE.or }, label: { position: 'right' } }); montants.set(s.nom, s.montant); });
    emplois.forEach(function (s) { noeuds.push({ name: s.nom, itemStyle: { color: PALETTE.grenat }, label: { position: 'left' } }); montants.set(s.nom, s.montant); });
    const liens = sources.map(function (s) { return { source: s.nom, target: centre, value: s.montant / 1000 }; })
      .concat(emplois.map(function (s) { return { source: centre, target: s.nom, value: s.montant / 1000 }; }));
    const etroit = n.clientWidth < 600;
    creerGraphique(n, {
      tooltip: Object.assign(optionsCommunes().tooltip, { trigger: 'item', formatter: function (p) {
        if (p.dataType === 'edge') return p.data.source + ' → ' + p.data.target + '\n' + formatNombre(p.data.value, 1) + ' k MAD';
        return p.name + '\n' + formatNombre((montants.get(p.name) || 0) / 1000, 1) + ' k MAD';
      } }),
      series: [{
        type: 'sankey', left: etroit ? 4 : 16, right: etroit ? 4 : 16, top: 32, bottom: 12,
        nodeWidth: 14, nodeGap: etroit ? 10 : 16, nodeAlign: 'justify', draggable: false, layoutIterations: 0,
        emphasis: { focus: 'adjacency' },
        data: noeuds, links: liens,
        lineStyle: { color: 'gradient', opacity: 0.35, curveness: 0.5 },
        label: { color: '#FFFFFF', fontFamily: 'Inter, system-ui, sans-serif', fontSize: etroit ? 10 : 12, lineHeight: etroit ? 13 : 16,
          formatter: function (p) { return (etroit ? couperLibelle(p.name, 14) : p.name) + '\n' + formatNombre((montants.get(p.name) || 0) / 1000, 1) + ' k MAD'; } }
      }]
    }, 'Sankey des flux 2027. Entrées : ' + sources.map(function (s) { return s.nom + ' ' + formatKMAD(s.montant) + ' k MAD'; }).join(', ') + '. Sorties : ' + emplois.map(function (s) { return s.nom + ' ' + formatKMAD(s.montant) + ' k MAD'; }).join(', ') + '.');
  }

  /* Entonnoir : EBITDA → flux opérationnel → après loyers → après service des emprunts */

  }

  /* Jauges : valeur face à la cible, au plafond ou au seuil (paramètres du fichier) */

  /* Bullet chart : délais clients, stocks et fournisseurs face à leur seuil vert */
  function graphBullet(n, m) {
    const correspondance = { CLIENTS: 'K06', STOCKS: 'K07', FOURNISSEURS: 'K08' };
    const rows = m.bfr.map(function (r) {
