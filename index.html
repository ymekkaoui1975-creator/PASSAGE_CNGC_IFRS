      return { libelle: k ? k.nomCourt : r.poste, valeur: r.valeur || 0, vert: estNombre(r.seuilVert) ? r.seuilVert : seuil.vert, ambre: seuil.ambre, sens: seuil.sens };
    });
    const max = Math.ceil(Math.max.apply(null, rows.map(function (r) { return Math.max(r.valeur, r.vert || 0, r.ambre || 0); }).concat([10])) * 1.18 / 10) * 10;
    const donnees = rows.map(function (r, i) { return { value: [i, r.valeur, r.vert, r.ambre, r.sens === 'haut' ? 1 : 0] }; });
    creerGraphique(n, {
      grid: { left: 8, right: 32, top: 12, bottom: 8, containLabel: true },
      xAxis: { type: 'value', min: 0, max: max, axisLabel: { color: PALETTE.texteDoux, formatter: function (v) { return formatNombre(v, 0) + ' j'; } }, splitLine: { lineStyle: { color: PALETTE.grille } } },
      yAxis: { type: 'category', inverse: true, data: rows.map(function (r) { return couperLibelle(r.libelle, 16); }), axisLabel: { color: PALETTE.texte, fontSize: 13, lineHeight: 16 }, axisLine: { lineStyle: { color: PALETTE.axe } }, axisTick: { show: false } },
      tooltip: Object.assign(optionsCommunes().tooltip, { trigger: 'item', formatter: function (p) { const r = rows[p.dataIndex]; return r.libelle + '\n2027 : ' + formatNombre(r.valeur, 1) + ' j\nSeuil vert : ' + formatNombre(r.vert, 0) + ' j' + (estNombre(r.ambre) ? '\nSeuil orange : ' + formatNombre(r.ambre, 0) + ' j' : ''); } }),
      series: [{
        type: 'custom', encode: { x: [1, 2], y: 0 }, data: donnees,
        renderItem: function (params, api) {
          const i = api.value(0), valeur = api.value(1), vert = api.value(2), ambre = api.value(3), haut = api.value(4) === 1;
          const hauteur = api.size([0, 1])[1];
          const yc = api.coord([0, i])[1];
          const x = function (v) { return api.coord([v, i])[0]; };
          const bande = hauteur * 0.5, barre = hauteur * 0.16;
          const zones = [];
          const ajouterZone = function (a, b, op) { if (!(b > a)) return; zones.push({ type: 'rect', shape: { x: x(a), y: yc - bande / 2, width: x(b) - x(a), height: bande }, style: { fill: 'rgba(255,255,255,' + op + ')' } }); };
          const am = Number.isFinite(ambre) ? ambre : vert;
          if (haut) { ajouterZone(0, am, 0.03); ajouterZone(am, vert, 0.07); ajouterZone(vert, max, 0.13); }
          else { ajouterZone(0, vert, 0.13); ajouterZone(vert, am, 0.07); ajouterZone(am, max, 0.03); }
          return { type: 'group', children: zones.concat([
            { type: 'rect', shape: { x: x(0), y: yc - barre / 2, width: Math.max(2, x(valeur) - x(0)), height: barre, r: 2 }, style: { fill: PALETTE.or } },
            { type: 'rect', shape: { x: x(vert) - 1.5, y: yc - bande / 2 - 4, width: 3, height: bande + 8 }, style: { fill: '#FFFFFF' } },
            { type: 'text', style: { text: formatNombre(valeur, 1) + ' j', x: x(valeur) + 8, y: yc, fill: '#FFFFFF', font: POLICE_CHIFFRES, align: 'left', verticalAlign: 'middle' } },
            { type: 'text', style: { text: 'seuil vert ' + formatNombre(vert, 0) + ' j', x: x(vert), y: yc + bande / 2 + 6, fill: PALETTE.texteDoux, font: '300 11px Inter, system-ui, sans-serif', align: 'center', verticalAlign: 'top' } }
          ]) };
        }
      }]
    }, 'Bullet chart des délais 2027 : ' + rows.map(function (r) { return r.libelle + ' ' + formatNombre(r.valeur, 1) + ' jours pour un seuil vert de ' + formatNombre(r.vert, 0); }).join(' ; '));
  }

  /* =======================================================================
     8. FOND ANIMÉ · particules noires brillantes reliées (coupé si besoin)
     ======================================================================= */
  const fond = { actif: false, particules: [], ctx: null, largeur: 0, hauteur: 0, demande: 0 };
  function demarrerFond() {
    const canvas = document.getElementById('particules');
    const doitTourner = !reduireAnimations.matches && !window.matchMedia('(max-width: 767px)').matches;
    if (!doitTourner) { fond.actif = false; cancelAnimationFrame(fond.demande); if (canvas.getContext) { const c = canvas.getContext('2d'); if (c) c.clearRect(0, 0, canvas.width, canvas.height); } return; }
    if (fond.actif) return;
    fond.actif = true;
    fond.ctx = canvas.getContext('2d');
    const dimension = function () {
      const r = Math.min(window.devicePixelRatio || 1, 2);
      fond.largeur = window.innerWidth; fond.hauteur = window.innerHeight;
      canvas.width = fond.largeur * r; canvas.height = fond.hauteur * r;
      fond.ctx.setTransform(r, 0, 0, r, 0, 0);
    };
    dimension();
    window.addEventListener('resize', dimension);
    const nombre = Math.round(Math.min(56, fond.largeur * fond.hauteur / 26000));
    fond.particules = [];
    for (let i = 0; i < nombre; i++) {
      fond.particules.push({ x: Math.random() * fond.largeur, y: Math.random() * fond.hauteur, vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12, r: 1.6 + Math.random() * 3.2 });
    }
    const image = function () {
      if (!fond.actif) return;
      if (!document.hidden) {
        const c = fond.ctx;
        c.clearRect(0, 0, fond.largeur, fond.hauteur);
        const ps = fond.particules;
        for (const p of ps) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < -10) p.x = fond.largeur + 10; if (p.x > fond.largeur + 10) p.x = -10;
          if (p.y < -10) p.y = fond.hauteur + 10; if (p.y > fond.hauteur + 10) p.y = -10;
        }
        c.lineWidth = 0.6;
        for (let i = 0; i < ps.length; i++) {
          for (let j = i + 1; j < ps.length; j++) {
            const dx = ps[i].x - ps[j].x, dy = ps[i].y - ps[j].y, d2 = dx * dx + dy * dy;
            if (d2 < 26000) { c.strokeStyle = 'rgba(255,255,255,' + (0.05 * (1 - d2 / 26000)).toFixed(3) + ')'; c.beginPath(); c.moveTo(ps[i].x, ps[i].y); c.lineTo(ps[j].x, ps[j].y); c.stroke(); }
          }
        }
        for (const p of ps) {
          const g = c.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.35, 0, p.x, p.y, p.r);
          g.addColorStop(0, 'rgba(255,255,255,0.55)');
          g.addColorStop(0.25, 'rgba(60,60,60,0.9)');
          g.addColorStop(1, 'rgba(0,0,0,0.95)');
          c.fillStyle = g;
          c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2); c.fill();
        }
      }
      fond.demande = requestAnimationFrame(image);
    };
    fond.demande = requestAnimationFrame(image);
  }

  /* =======================================================================
     9. DÉMARRAGE
     ======================================================================= */
  function brancherEvenements() {
    window.addEventListener('hashchange', function () { fermerVolet(); rendre(); });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && etat.syncActive && (etat.mode === 'A' || etat.mode === 'B')) { etat.derniereVerif = 0; verifierMaintenant(); }
    });
    document.getElementById('choix-fichier').addEventListener('change', function (e) {
      const f = e.target.files && e.target.files[0];
      if (f) importerFichier(f);
    });
    document.getElementById('volet-fond').addEventListener('click', fermerVolet);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fermerVolet(); });
    /* Glisser-déposer : connexion en direct si le navigateur le permet */
    const voile = document.getElementById('voile-depot');
    let profondeur = 0;
    document.addEventListener('dragenter', function (e) { if (!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf('Files') < 0) return; e.preventDefault(); profondeur++; voile.classList.add('actif'); });
    document.addEventListener('dragleave', function () { profondeur = Math.max(0, profondeur - 1); if (!profondeur) voile.classList.remove('actif'); });
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', async function (e) {
      e.preventDefault();
      profondeur = 0; voile.classList.remove('actif');
      const dt = e.dataTransfer;
      if (!dt) return;
      const item = dt.items && dt.items[0];
      const promessePoignee = item && item.kind === 'file' && typeof item.getAsFileSystemHandle === 'function' ? item.getAsFileSystemHandle() : null;
      const fichier = dt.files && dt.files[0];
      if (promessePoignee) {
        try {
          const poignee = await promessePoignee;
          if (poignee && poignee.kind === 'file') { await brancherPoignee(poignee); return; }
        } catch (err) { /* repli : import simple */ }
      }
      if (fichier) importerFichier(fichier);
    });
    const relancerFond = function () { fond.actif = false; cancelAnimationFrame(fond.demande); demarrerFond(); if (etat.modele) rendre({ conserverDefilement: true }); };
    if (reduireAnimations.addEventListener) reduireAnimations.addEventListener('change', relancerFond);
    if (ecranMobile.addEventListener) ecranMobile.addEventListener('change', function () { fermerVolet(); if (etat.modele) rendre({ conserverDefilement: true }); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (etat.modele && !donneesBloquees()) { const jeton = ++jetonRendu; requestAnimationFrame(function () { if (jeton === jetonRendu) { detruireGraphiques(); dessinerGraphiques(etat.modele); } }); } });
  }

  async function demarrer() {
    if (estDansUnCadre()) {
      /* Ouverte à l'intérieur d'un autre site : le contenu reste masqué. */
      document.body.replaceChildren(el('p', { style: 'padding:24px;color:#E0AE28;font-family:sans-serif', texte: 'Cette application ne peut pas être affichée à l’intérieur d’un autre site. Ouvrez-la directement.' }));
      document.documentElement.classList.remove('anti-cadre');
      return;
    }
    document.documentElement.classList.remove('anti-cadre');
    etat.syncActive = lirePreferenceSync();
    brancherEvenements();
    demarrerFond();
    afficherSync();
    rendre();
    setInterval(battement, 1000);

    /* 1) Reconnecter le fichier déjà connecté (mode A) */
    if (API_DIRECTE) {
      const poignee = await idb('lire');
      if (poignee && typeof poignee.getFile === 'function') {
        etat.fichierNom = poignee.name || '';
        let perm = 'prompt';
        try { perm = typeof poignee.queryPermission === 'function' ? await poignee.queryPermission({ mode: 'read' }) : 'granted'; } catch (e) { perm = 'prompt'; }
        if (perm === 'granted') {
          etat.poignee = poignee;
          etat.mode = 'A';
          etat.premiereLecture = false;
          changerStatut('lecture');
          await verifierMaintenant();
          if (etat.modele) { rendre(); return; }
          /* Fichier déplacé, renommé ou supprimé : état orange, la raison reste affichée. */
          etat.poigneeEnAttente = poignee;
          etat.poignee = null;
          if (etat.statut !== 'reconnexion') changerStatut('reconnexion', 'Le fichier connecté n’a pas pu être relu.');
        } else {
          etat.poigneeEnAttente = poignee;
          changerStatut('reconnexion', 'Le navigateur demande à nouveau l’autorisation de lire « ' + (poignee.name || 'votre fichier') + ' ».');
        }
      }
    }
    /* 2) Sinon, charger donnees.xlsx à côté d'index.html (mode B) */
    if (PROTOCOLE_WEB) {
      etat.mode = 'B';
      etat.premiereLecture = false;
      if (etat.statut !== 'reconnexion') changerStatut('lecture');
      etat.occupe = true;
      try { await verifierModeB(false); } catch (e) { signalerErreur(e); }
      finally { etat.occupe = false; etat.derniereVerif = Date.now(); }
      if (!etat.modele && etat.statut === 'lecture') changerStatut('aucun');
      rendre();
      return;
    }
    /* 3) Sinon, « Connecter mon fichier Excel » (mode A) ou import (mode C) */
    etat.premiereLecture = false;
    if (!API_DIRECTE) etat.mode = 'C';
    if (etat.statut !== 'reconnexion') changerStatut('aucun');
    rendre();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
  else demarrer();
})();
</script>
